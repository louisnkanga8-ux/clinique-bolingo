<!--
  Étoile : dessin vectoriel local, net quelle que soit la taille d’affichage.
  viewBox définit le repère des coordonnées ; path, circle ou les autres formes dessinent l’icône.
  fill règle le remplissage, stroke le contour. Les tailles visibles sont définies en HTML/CSS.
  L’alternative textuelle est portée par l’élément img de la page qui utilise ce fichier.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#0063ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path fill="#f5b800" stroke="#f5b800" d="m12 2 3 6.2 6.8 1-4.9 4.8 1.2 6.8L12 17.6l-6.1 3.2 1.2-6.8-4.9-4.8 6.8-1L12 2Z"/></svg>
